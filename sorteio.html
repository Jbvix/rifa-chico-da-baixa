 MODIFICAÇÕES v2.4.0 (2026-11-16) — BOLA DE AUDITORIA (aprovado por Charlie Bravo)

      Centena: 0, 1 + A   |   Dezena: 0–9 + A   |   Unidade: 0–9 + A
  - [REGRA] Se a auditoria sair, ela é mostrada, registrada, devolvida à

  - [COR] Centena passa de vermelha para AZUL; o vermelho fica exclusivo da

 MODIFICAÇÕES v2.0.0 (2026-11-16) — reescrita de UX e de física

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Gaiola de Sorteio</title>
<style>
  :root {
    --verde: #006B3F; --verde-esc: #00391f; --vermelho: #C8102E; --ouro: #f2b705; --azul: #1565C0;
    --texto: #f3f7f4; --painel: rgba(6, 28, 18, .78); --borda: rgba(255,255,255,.14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #0f5a38 0%, #062b1b 55%, #021209 100%);
  }
  #palco { position: fixed; inset: 0; }
  #palco canvas { display: block; }

  /* Barra superior */
  .topo {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 14px; background: linear-gradient(180deg, rgba(0,0,0,.45), transparent);
  }
  .topo h1 { margin: 0; font-size: 1.05rem; letter-spacing: .3px; }
  .topo h1 small { display: block; font-weight: 400; opacity: .75; font-size: .75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topo h1 { min-width: 0; } .icones { flex-shrink: 0; }
  .icones { display: flex; gap: 6px; }
  .icone {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--borda);
    background: var(--painel); color: var(--texto); font-size: 1.1rem; cursor: pointer;
    display: grid; place-items: center; text-decoration: none;
  }
  .icone:focus-visible, .btn:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }

  /* Painel inferior: placar + botão */
  .painel {
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 10; width: min(520px, calc(100% - 24px));
    background: var(--painel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--borda); border-radius: 20px; padding: 14px 16px 16px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  .status { font-size: .9rem; opacity: .85; min-height: 1.3em; margin-bottom: 8px; }
  .placar { display: flex; justify-content: center; gap: 10px; margin-bottom: 6px; }
  .casa { width: 74px; }
  .casa .digito {
    height: 84px; border-radius: 14px; display: grid; place-items: center;
    font-size: 3.2rem; font-weight: 800; font-variant-numeric: tabular-nums;
    background: #fff; color: #0b2b1c; box-shadow: inset 0 -6px 0 rgba(0,0,0,.08);
    transition: transform .25s;
  }
  .casa .digito.vazio { background: rgba(255,255,255,.08); color: rgba(255,255,255,.35); box-shadow: none; }
  .casa .digito.pop { animation: pop .45s ease-out; }
  @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .casa span { display: block; font-size: .72rem; margin-top: 4px; opacity: .75; text-transform: uppercase; letter-spacing: .5px; }
  .casa:nth-child(1) .digito:not(.vazio) { border-bottom: 6px solid var(--azul); }
  /* Bola de auditoria exibida no placar (v2.4.0) */
  .casa .digito.auditoria { background: var(--vermelho) !important; color: #fff !important; border-bottom: 6px solid #7a0a1c !important; font-size: 2.6rem; }
  .resultado small { display: block; font-size: .8rem; opacity: .75; margin-top: 2px; }
  .casa:nth-child(2) .digito:not(.vazio) { border-bottom: 6px solid var(--verde); }
  .casa:nth-child(3) .digito:not(.vazio) { border-bottom: 6px solid var(--ouro); }
  .resultado { min-height: 1.5em; font-size: 1.05rem; margin: 6px 0 10px; }
  .resultado strong { color: var(--ouro); }
  .resultado .ganhador { font-size: 1.15rem; margin-top: 4px; }
  .relogio { font-variant-numeric: tabular-nums; font-size: 1.05rem; font-weight: 700; color: var(--ouro); margin: 2px 0 4px; }
  .btn {
    width: 100%; border: 0; border-radius: 14px; padding: 15px; cursor: pointer;
    font-size: 1.15rem; font-weight: 700; color: #1a1300;
    background: linear-gradient(180deg, #ffd34d, var(--ouro)); box-shadow: 0 4px 0 #a87c00;
    transition: transform .1s, filter .2s;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #a87c00; }
  .btn:disabled { filter: grayscale(.8) brightness(.8); cursor: wait; }
  .dica { font-size: .72rem; opacity: .6; margin-top: 6px; }
  .btn-som { margin: 0 0 10px; padding: 10px; font-size: 1rem; background: linear-gradient(180deg, #4fd1a5, #1f9e74); color: #04261a; box-shadow: 0 3px 0 #136b4e; }
  .btn-som[hidden] { display: none; }
  .btn-demo { margin-top: 8px; padding: 11px; font-size: 1rem; }
  .btn-demo[hidden] { display: none; }
  @media (orientation: landscape) and (max-height: 500px) { .btn-demo, .btn-som { padding: 8px; font-size: .9rem; } }

  /* Histórico */
  .historico {
    position: fixed; top: 64px; right: 12px; z-index: 9; width: 190px; max-height: 40vh; overflow: auto;
    background: var(--painel); border: 1px solid var(--borda); border-radius: 14px; padding: 10px 12px; font-size: .85rem;
  }
  .historico[hidden], [data-teste][hidden] { display: none !important; }
  .historico h2 { font-size: .8rem; margin: 0 0 6px; text-transform: uppercase; opacity: .75; }
  .historico ol { margin: 0; padding-left: 18px; }
  .historico li { margin: 3px 0; }

  /* Número gigante no final */
  .destaque {
    position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; pointer-events: none;
    font-size: min(38vw, 260px); font-weight: 900; color: #fff; opacity: 0;
    text-shadow: 0 0 40px rgba(242,183,5,.8), 0 8px 0 rgba(0,0,0,.25);
    transition: opacity .4s, transform .6s; transform: scale(.6);
  }
  .destaque.on { opacity: 1; transform: scale(1); }
  #confete { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
  .semwebgl { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; opacity: .8; }

  @media (max-width: 560px) {
    .historico { top: auto; bottom: 250px; right: 8px; width: 150px; max-height: 22vh; }
    .casa { width: 64px; } .casa .digito { height: 72px; font-size: 2.6rem; }
  }
  /* Smartphone deitado: painel em coluna à direita (v2.7.0) */
  @media (orientation: landscape) and (max-height: 500px) {
    .topo { padding: 6px 12px; }
    .topo h1 { font-size: .95rem; }
    .icone { width: 34px; height: 34px; font-size: .95rem; }
    .painel {
      left: auto; right: max(10px, env(safe-area-inset-right)); transform: none;
      top: 52px; bottom: 10px; width: min(300px, 38vw);
      display: flex; flex-direction: column; justify-content: center; padding: 10px 12px; overflow-y: auto;
    }
    .casa { width: 54px; } .casa .digito { height: 60px; font-size: 2.2rem; }
    .casa span { font-size: .62rem; }
    .resultado { font-size: .9rem; margin: 4px 0; } .resultado .ganhador { font-size: 1rem; }
    .relogio { font-size: .95rem; }
    .status { font-size: .8rem; margin-bottom: 6px; }
    .girar { display: none !important; }
  }
  .girar { display: none; font-size: .75rem; opacity: .7; margin-top: 6px; }
  @media (orientation: portrait) and (max-width: 560px) { .girar { display: block; } }
  @media (prefers-reduced-motion: reduce) {
    .casa .digito.pop { animation: none; } .destaque { transition: opacity .2s; transform: none; }
  }
</style>
</head>
<body>
<div id="palco" aria-hidden="true"></div>
<canvas id="confete" aria-hidden="true"></canvas>
<div id="destaque" class="destaque" aria-hidden="true"></div>

<header class="topo">
  <h1>🎱 Gaiola de Sorteio<small>Rifa Solidária • Chico da Baixa • 001 a <span id="totalTxt">199</span></small></h1>
  <div class="icones">
    <button class="icone" id="btnHist" title="Histórico" aria-label="Mostrar histórico" hidden data-teste>🕘</button>
    <button class="icone" id="btnSom" title="Som" aria-label="Desligar som" aria-pressed="true">🔊</button>
    <button class="icone" id="btnTela" title="Tela cheia" aria-label="Tela cheia">⛶</button>
    <a class="icone" href="/" title="Voltar à rifa" aria-label="Voltar à rifa">↩</a>
  </div>
</header>

<aside class="historico" id="historico" hidden>
  <h2>Sorteios desta sessão</h2>
  <ol id="listaHist"></ol>
</aside>

<section class="painel" aria-label="Painel do sorteio">
  <!-- v2.9.0: navegadores de celular só tocam som após um toque do usuário -->
  <button class="btn btn-som" id="ativarSom">🔊 Toque para ativar voz e música</button>
  <div class="status" id="status" aria-live="polite">Conectando ao sorteio oficial…</div>
  <div class="placar" aria-hidden="true">
    <div class="casa"><div class="digito vazio" id="d0">–</div><span>Centena</span></div>
    <div class="casa"><div class="digito vazio" id="d1">–</div><span>Dezena</span></div>
    <div class="casa"><div class="digito vazio" id="d2">–</div><span>Unidade</span></div>
  </div>
  <div class="relogio" id="relogioBox" hidden><span id="relogio"></span></div>
  <div class="resultado" id="resultado" aria-live="assertive"></div>
  <!-- Sorteio manual só no modo teste (?teste=1). O oficial é automático. -->
  <button class="btn" id="btnSortear" hidden data-teste>Sortear (teste)</button>
  <!-- v3.2.0: demonstração para o visitante (não oficial), até 2 min antes do sorteio -->
  <button class="btn btn-demo" id="btnDemo" hidden>▶️ Ver demonstração das gaiolas</button>
  <div class="dica" hidden data-teste>Atalho: Espaço ou Enter</div>
  <div class="girar">🔄 Gire o celular para ver as gaiolas maiores</div>
</section>

<script src="/vendor/three-r128.min.js"></script>
<script src="/sorteio.js"></script>
</body>
</html>
